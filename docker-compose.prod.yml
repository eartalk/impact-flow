name: impact-flow

services:
  repository-init:
    image: busybox:1.36.1
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /repositories"]
    volumes:
      - repository-cache:/repositories

  api:
    build:
      context: .
      target: api
    image: impact-flow-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      API_PORT: 3012
      DATABASE_HOST: my-mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-impact_flow}
      DATABASE_USER: ${MYSQL_USER:-impact_flow}
      DATABASE_PASSWORD_FILE: /run/secrets/mysql_password
      REPOSITORY_CACHE_DIR: /app/var/repositories
      GIT_SSH_COMMAND: ssh -i /home/node/.ssh/codeup_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/node/.ssh/known_hosts
    volumes:
      - repository-cache:/app/var/repositories
      - ./secrets/mysql_password:/run/secrets/mysql_password:ro
      - ${HOME}/.ssh:/home/node/.ssh:ro
    depends_on:
      repository-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3012/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  web:
    build:
      context: .
      target: web
    image: impact-flow-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - backend

volumes:
  repository-cache:

networks:
  backend:
    external: true
    name: impact-flow-backend
